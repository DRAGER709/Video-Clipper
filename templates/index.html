<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clip Bench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #121214;
    --surface: #1B1B1F;
    --surface-2: #232328;
    --border: #313136;
    --text: #F2F0EB;
    --text-muted: #8C8C93;
    --accent: #F2542D;
    --accent-dim: #7A2E19;
    --success: #4FAE7E;
    --error: #E15555;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 48px 20px 80px;
  }

  .wrap { width: 100%; max-width: 640px; }

  .sprocket-strip {
    height: 14px;
    background-repeat: repeat-x;
    background-size: 28px 14px;
    background-image: radial-gradient(circle at 7px 7px, var(--surface-2) 3.5px, transparent 3.6px);
    opacity: 0.9;
  }

  header { text-align: center; margin: 28px 0 36px; }
  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 2rem;
    margin: 0 0 6px;
    letter-spacing: -0.02em;
  }
  h1 span { color: var(--accent); }
  header p { color: var(--text-muted); margin: 0; font-size: 0.95rem; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 28px;
  }

  .tabs { display: flex; gap: 2px; margin-bottom: 20px; background: var(--surface-2); border-radius: 3px; padding: 3px; }
  .tab {
    flex: 1; text-align: center; padding: 9px 0; cursor: pointer;
    border-radius: 2px; font-size: 0.85rem; font-weight: 500; color: var(--text-muted);
    transition: background 0.15s, color 0.15s;
  }
  .tab.active { background: var(--accent); color: #fff; }

  .panel { display: none; }
  .panel.active { display: block; }

  label {
    display: block; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--text-muted); margin: 18px 0 6px;
  }
  label:first-of-type { margin-top: 0; }

  input[type=text], input[type=file], select {
    width: 100%; background: var(--surface-2); border: 1px solid var(--border);
    color: var(--text); padding: 10px 12px; border-radius: 3px; font-size: 0.92rem;
    font-family: inherit;
  }
  input[type=text]:focus, select:focus { outline: 1px solid var(--accent); border-color: var(--accent); }

  .row { display: flex; gap: 14px; }
  .row > div { flex: 1; }

  .hint { font-size: 0.78rem; color: var(--text-muted); margin-top: 6px; line-height: 1.4; }

  button.submit {
    width: 100%; margin-top: 26px; padding: 13px; background: var(--accent); color: #fff;
    border: none; border-radius: 3px; font-size: 0.95rem; font-weight: 600; cursor: pointer;
    font-family: 'Space Grotesk', sans-serif; letter-spacing: 0.01em;
    transition: background 0.15s;
  }
  button.submit:hover { background: #ff6a3f; }
  button.submit:disabled { background: var(--accent-dim); cursor: not-allowed; }

  #progress-section, #results-section { display: none; margin-top: 24px; }

  .filmstrip {
    display: flex; gap: 3px; height: 10px; margin-bottom: 14px;
  }
  .frame {
    flex: 1; background: var(--surface-2); border-radius: 1px;
    transition: background 0.3s;
  }
  .frame.done { background: var(--success); }
  .frame.active { background: var(--accent); }

  .log-box {
    background: #0C0C0E; border: 1px solid var(--border); border-radius: 3px;
    padding: 12px 14px; height: 160px; overflow-y: auto;
    font-family: 'IBM Plex Mono', monospace; font-size: 0.78rem; color: var(--text-muted);
    line-height: 1.6;
  }
  .log-box .err { color: var(--error); }

  .status-line { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 10px; }
  .status-line strong { color: var(--text); }

  .clip-grid { display: flex; flex-direction: column; gap: 10px; }
  .clip-card {
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 3px;
    padding: 14px; display: flex; align-items: center; gap: 14px;
  }
  .clip-card video { width: 120px; border-radius: 2px; background: #000; }
  .clip-meta { flex: 1; min-width: 0; }
  .clip-meta .name { font-family: 'IBM Plex Mono', monospace; font-size: 0.82rem; margin-bottom: 4px; word-break: break-all; }
  .clip-meta .sub { font-size: 0.78rem; color: var(--text-muted); }
  .dl-btn {
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    padding: 8px 14px; border-radius: 3px; text-decoration: none; font-size: 0.82rem;
    white-space: nowrap;
  }
  .dl-btn:hover { border-color: var(--accent); color: var(--accent); }

  .error-box {
    background: rgba(225,85,85,0.1); border: 1px solid var(--error); color: var(--error);
    padding: 12px 14px; border-radius: 3px; font-size: 0.85rem; margin-top: 14px;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="sprocket-strip"></div>
  <header>
    <h1>Clip <span>Bench</span></h1>
    <p>Turn a long video into 60&ndash;90s clips, captioned automatically.</p>
  </header>

  <div class="card">
    <form id="clip-form">
      <div class="tabs">
        <div class="tab active" data-tab="url">YouTube URL</div>
        <div class="tab" data-tab="file">Upload file</div>
      </div>

      <div class="panel active" id="panel-url">
        <label for="url">Video URL</label>
        <input type="text" id="url" name="url" placeholder="https://youtube.com/watch?v=...">
      </div>

      <div class="panel" id="panel-file">
        <label for="file">Video file</label>
        <input type="file" id="file" name="file" accept="video/*">
      </div>

      <div class="row">
        <div>
          <label for="mode">Cut mode</label>
          <select id="mode" name="mode">
            <option value="fixed">Fixed length (fast)</option>
            <option value="scene">Scene cuts</option>
            <option value="smart">Smart highlights</option>
          </select>
        </div>
        <div>
          <label for="captions">Captions</label>
          <select id="captions" name="captions">
            <option value="burn" selected>Burn into video</option>
            <option value="srt">Separate .srt file</option>
            <option value="none">None</option>
          </select>
        </div>
      </div>

      <div class="row">
        <div>
          <label for="whisper_model">Caption quality</label>
          <select id="whisper_model" name="whisper_model">
            <option value="tiny">Tiny (fastest)</option>
            <option value="small" selected>Small (balanced)</option>
            <option value="medium">Medium (slower, better)</option>
          </select>
        </div>
        <div>
          <label for="max_clips">Max clips (optional)</label>
          <input type="text" id="max_clips" name="max_clips" placeholder="no limit">
        </div>
      </div>
      <div class="hint">Scene &amp; smart modes scan the whole video first, so a 2-hour movie will take a while. Fixed mode is near-instant.</div>

      <button type="submit" class="submit" id="submit-btn">Generate clips</button>
    </form>

    <div id="progress-section">
      <div class="status-line" id="status-line"><strong>Working&hellip;</strong></div>
      <div class="filmstrip" id="filmstrip"></div>
      <div class="log-box" id="log-box"></div>
    </div>

    <div id="error-section"></div>

    <div id="results-section">
      <div class="status-line"><strong>Done</strong> &mdash; clips are saved in the <code>clips/</code> folder.</div>
      <div class="clip-grid" id="clip-grid"></div>
    </div>
  </div>
</div>

<script>
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
  });
});

const form = document.getElementById('clip-form');
const submitBtn = document.getElementById('submit-btn');
const progressSection = document.getElementById('progress-section');
const resultsSection = document.getElementById('results-section');
const errorSection = document.getElementById('error-section');
const logBox = document.getElementById('log-box');
const statusLine = document.getElementById('status-line');
const filmstrip = document.getElementById('filmstrip');

let pollTimer = null;

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  submitBtn.disabled = true;
  submitBtn.textContent = 'Starting…';
  errorSection.innerHTML = '';
  resultsSection.style.display = 'none';
  progressSection.style.display = 'block';
  logBox.innerHTML = '';
  filmstrip.innerHTML = '';

  const fd = new FormData(form);
  const activeTab = document.querySelector('.tab.active').dataset.tab;
  if (activeTab === 'url') fd.delete('file'); else fd.delete('url');

  let jobId;
  try {
    const res = await fetch('/process', { method: 'POST', body: fd });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed to start job');
    jobId = data.job_id;
  } catch (err) {
    showError(err.message);
    resetButton();
    return;
  }

  submitBtn.textContent = 'Processing…';
  pollTimer = setInterval(() => pollStatus(jobId), 1200);
});

async function pollStatus(jobId) {
  try {
    const res = await fetch('/status/' + jobId);
    const job = await res.json();

    logBox.innerHTML = job.log.map(l => {
      const cls = l.startsWith('ERROR') ? ' class="err"' : '';
      return `<div${cls}>${escapeHtml(l)}</div>`;
    }).join('');
    logBox.scrollTop = logBox.scrollHeight;

    updateFilmstrip(job.log);

    if (job.status === 'done') {
      clearInterval(pollTimer);
      statusLine.innerHTML = '<strong>Done</strong>';
      showResults(jobId, job.clips);
      resetButton();
    } else if (job.status === 'error') {
      clearInterval(pollTimer);
      showError(job.error);
      resetButton();
    }
  } catch (err) {
    clearInterval(pollTimer);
    showError('Lost connection to the server.');
    resetButton();
  }
}

function updateFilmstrip(log) {
  const doneMatches = log.filter(l => /^Clip \d+\/\d+ done/.test(l));
  const totalMatch = log.find(l => l.match(/Cutting (\d+) clips/));
  if (!totalMatch) return;
  const total = parseInt(totalMatch.match(/Cutting (\d+) clips/)[1], 10);
  if (filmstrip.children.length !== total) {
    filmstrip.innerHTML = '';
    for (let i = 0; i < total; i++) {
      const f = document.createElement('div');
      f.className = 'frame';
      filmstrip.appendChild(f);
    }
  }
  [...filmstrip.children].forEach((f, i) => {
    f.classList.toggle('done', i < doneMatches.length);
  });
  statusLine.innerHTML = `<strong>${doneMatches.length} / ${total} clips</strong> done`;
}

function showResults(jobId, clips) {
  resultsSection.style.display = 'block';
  const grid = document.getElementById('clip-grid');
  grid.innerHTML = clips.map(c => {
    const url = `/clips/${jobId}/${encodeURIComponent(c.filename)}`;
    const lang = c.language ? ` &middot; ${c.language}` : '';
    return `
      <div class="clip-card">
        <video src="${url}" controls preload="metadata"></video>
        <div class="clip-meta">
          <div class="name">${escapeHtml(c.filename)}</div>
          <div class="sub">${Math.round(c.end - c.start)}s${lang}</div>
        </div>
        <a class="dl-btn" href="${url}" download>Download</a>
      </div>`;
  }).join('');
}

function showError(msg) {
  errorSection.innerHTML = `<div class="error-box">${escapeHtml(msg)}</div>`;
}

function resetButton() {
  submitBtn.disabled = false;
  submitBtn.textContent = 'Generate clips';
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
</script>
</body>
</html>
